<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Il mio patrimonio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f4f5f7;color:#111827}
.app{max-width:600px;margin:auto;padding:18px 16px 40px}
h1{font-size:28px;margin:10px 0 4px}.sub{color:#6b7280;margin-bottom:18px}
.card{background:white;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000b}
.balance{font-size:38px;font-weight:800;margin:6px 0}.label{font-size:13px;color:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:white}
button{border:0;border-radius:12px;padding:13px 15px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white;width:100%;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.stat{font-weight:700;font-size:20px}.expense{padding:13px 0;border-bottom:1px solid #eee}.expense:last-child{border-bottom:0}
.del{background:#f3f4f6;padding:7px 10px;font-size:14px}.negative{color:#b91c1c}.positive{color:#047857}
.month{font-weight:700;font-size:18px}
.small{font-size:13px;color:#6b7280}.empty{text-align:center;color:#6b7280;padding:20px 0}
</style>
</head>
<body>
<div class="app">
<h1>💰 Il mio patrimonio</h1><div class="sub" id="monthName"></div>

<div class="card">
<div class="label">PATRIMONIO INIZIALE</div>
<div class="row"><div class="balance" id="balance">€ 0,00</div></div>
<div class="small" id="summary">Speso questo mese: € 0,00</div>
</div>

<div class="card">
<div class="month">Imposta patrimonio del mese</div>
<input id="initial" type="number" min="0" step="0.01" placeholder="es. 16.000">
<button class="primary" id="saveInitial">Salva patrimonio</button>
</div>

<div class="card">
<div class="month">➖ Nuova spesa</div>
<div class="grid" style="margin-top:12px">
<div><div class="label">IMPORTO</div><input id="amount" type="number" min="0.01" step="0.01" placeholder="10,00"></div>
<div><div class="label">DATA</div><input id="date" type="date"></div>
</div>
<div style="margin-top:10px"><div class="label">DESCRIZIONE</div><input id="note" maxlength="80" placeholder="Cena, benzina, spesa..."></div>
<button class="primary" id="add">Aggiungi spesa</button>
</div>

<div class="card">
<div class="row"><div class="month">📋 Spese del mese</div><div class="stat" id="total">€ 0,00</div></div>
<div id="list"></div>
</div>

<div class="card">
<div class="label">RISPARMIO DEL MESE</div>
<div class="stat positive" id="saving">€ 0,00</div>
<div class="small">Patrimonio iniziale meno tutte le spese registrate.</div>
</div>
</div>

<script>
const KEY="patrimonio-app-v1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"months":{}}');
const now=new Date(), key=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
const $=id=>document.getElementById(id);
$("date").value=now.toISOString().slice(0,10);
$("monthName").textContent=now.toLocaleDateString("it-IT",{month:"long",year:"numeric"});
function month(){if(!data.months[key])data.months[key]={initial:0,expenses:[]};return data.months[key]}
function euro(n){return new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n)}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 const m=month(), total=m.expenses.reduce((a,e)=>a+e.amount,0), bal=m.initial-total;
 $("balance").textContent=euro(bal); $("balance").className="balance "+(bal<0?"negative":"");
 $("summary").textContent="Speso questo mese: "+euro(total);
 $("total").textContent=euro(total); $("saving").textContent=euro(bal);
 $("initial").value=m.initial||"";
 const list=$("list");
 if(!m.expenses.length){list.innerHTML='<div class="empty">Nessuna spesa ancora 😊</div>';return}
 list.innerHTML=m.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`
 <div class="expense row"><div><b>${escapeHtml(e.note||"Spesa")}</b><div class="small">${new Date(e.date+"T12:00:00").toLocaleDateString("it-IT")}</div></div>
 <div class="row"><b>− ${euro(e.amount)}</b><button class="del" data-id="${e.id}">Elimina</button></div></div>`).join("");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
$("saveInitial").onclick=()=>{let v=Number($("initial").value);if(Number.isFinite(v)&&v>=0){month().initial=v;save();render()}};
$("add").onclick=()=>{let amount=Number($("amount").value),date=$("date").value,note=$("note").value.trim();if(!amount||amount<=0||!date)return;let m=month();m.expenses.push({id:Date.now(),amount,date,note});save();$("amount").value="";$("note").value="";render()};
$("list").onclick=e=>{let b=e.target.closest("[data-id]");if(!b)return;month().expenses=month().expenses.filter(x=>String(x.id)!==b.dataset.id);save();render()};
render();
</script>
</body>
</html>
